<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Admin - Jewels</title>
  <link rel="stylesheet" href="../shared/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&family=Sofia+Sans:ital,wght@0,1..1000;1,1..1000&display=swap" rel="stylesheet">
  <style>
    :root {
      --admin-primary: #704204;
      --admin-primary-soft: rgba(112, 66, 4, 0.12);
      --admin-bg: #f7f3ee;
      --admin-panel: #ffffff;
      --admin-line: #e7dfd5;
      --admin-text: #1f1a17;
      --admin-muted: #6e685f;
      --admin-error: #c15542;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #f9f5f0 0%, var(--admin-bg) 40%, #efe7dc 100%);
      color: var(--admin-text);
      font-family: var(--body-font);
    }

    .login-shell {
      width: min(940px, calc(100% - 32px));
      min-height: 640px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      border: 1px solid var(--admin-line);
      border-radius: 28px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      box-shadow: 0 30px 70px rgba(39, 27, 11, 0.12);
    }

    .login-visual {
      position: relative;
      display: flex;
      align-items: end;
      padding: 42px;
      background: linear-gradient(135deg, rgba(112, 66, 4, 0.9), rgba(64, 42, 17, 0.85)), url("../shared/images/banner-image2.jpg") center/cover no-repeat;
      color: #fff;
    }

    .login-visual::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(12, 8, 5, 0.2);
    }

    .login-visual-inner {
      position: relative;
      z-index: 1;
    }

    .brand-mark {
      display: inline-grid;
      place-items: center;
      width: 62px;
      height: 62px;
      margin-bottom: 24px;
      border-radius: 18px;
      background: rgba(255,255,255,0.18);
      font-family: "Cormorant Upright", serif;
      font-size: 2.6rem;
      font-weight: 700;
    }

    .login-visual h1 {
      margin: 0 0 12px;
      font-size: clamp(2.7rem, 4vw, 4.3rem);
      line-height: 0.95;
      font-weight: 500;
    }

    .login-visual p {
      margin: 0;
      max-width: 360px;
      color: rgba(255,255,255,0.86);
      font-size: 1rem;
    }

    .login-form-wrap {
      padding: 42px 38px;
      background: rgba(255, 255, 255, 0.9);
    }

    .login-form-wrap p {
      margin: 0;
      color: var(--admin-muted);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--admin-primary);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .login-form-wrap h2 {
      margin: 0 0 10px;
      font-size: clamp(2.2rem, 4vw, 3rem);
      line-height: 1;
      color: var(--admin-text);
    }

    .login-form {
      display: grid;
      gap: 18px;
      margin-top: 30px;
    }

    .field {
      display: grid;
      gap: 8px;
      color: var(--admin-text);
      font-weight: 600;
    }

    .field input {
      height: 52px;
      padding: 0 16px;
      border: 1px solid var(--admin-line);
      border-radius: 12px;
      background: #fff;
      font: inherit;
      color: var(--admin-text);
    }

    .field input:focus {
      outline: none;
      border-color: rgba(112, 66, 4, 0.5);
      box-shadow: 0 0 0 4px rgba(112, 66, 4, 0.08);
    }

    .login-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: -4px;
      font-size: 0.9rem;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--admin-muted);
    }

    .remember input {
      accent-color: var(--admin-primary);
    }

    .helper-link {
      color: var(--admin-primary);
      text-decoration: none;
    }

    .login-submit {
      height: 54px;
      border: 0;
      border-radius: 999px;
      background: var(--admin-primary);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .login-submit:hover {
      background: #5b3605;
    }

    .login-feedback {
      min-height: 24px;
      color: var(--admin-error);
      font-size: 0.92rem;
    }

    .admin-note {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--admin-line);
      color: var(--admin-muted);
      font-size: 0.88rem;
    }

    @media (max-width: 720px) {
      .login-shell {
        grid-template-columns: 1fr;
      }

      .login-visual {
        min-height: 260px;
      }

      .login-form-wrap {
        padding: 28px 22px 34px;
      }
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <aside class="login-visual" aria-label="Banner admin">
      <div class="login-visual-inner">
        <div class="brand-mark">J</div>
        <p class="eyebrow" style="color:#fff; opacity:0.8;">Jewels management</p>
        <h1>Admin portal</h1>
        <p>Người quản lý theo dõi doanh thu, đơn hàng, kho hàng và hoạt động kinh doanh trong một nơi.</p>
      </div>
    </aside>

    <section class="login-form-wrap">
      <p class="eyebrow">Bảo mật quản lý</p>
      <h2>Đăng nhập admin</h2>
      <p>Chỉ tài khoản quản trị mới được truy cập hệ thống nội bộ.</p>

      <form class="login-form" id="adminLoginForm" novalidate>
        <label class="field">
          Email admin
          <input name="email" type="email" placeholder="admin@jewels.vn" value="admin@jewels.vn" required>
        </label>

        <label class="field">
          Mật khẩu
          <input name="password" type="password" placeholder="Nhập mật khẩu" required>
        </label>

        <div class="login-meta">
          <label class="remember"><input type="checkbox" name="remember"> Ghi nhớ</label>
          <a class="helper-link" href="../client/index.html">Về trang chủ</a>
        </div>

        <button class="login-submit" type="submit">Đăng nhập</button>
        <p class="login-feedback" id="adminLoginFeedback" role="status" aria-live="polite"></p>
      </form>

      <div class="admin-note">
        Tài khoản quản lý: <strong>admin@jewels.vn</strong> / <strong>Admin@123</strong>
      </div>
    </section>
  </div>

  <script>
    const ADMIN_SESSION_KEY = "jewels-admin-session";
    const ADMIN_ACCOUNT = {
      name: "Quản trị viên",
      email: "admin@jewels.vn",
      password: "Admin@123"
    };

    const loginForm = document.getElementById("adminLoginForm");
    const feedback = document.getElementById("adminLoginFeedback");

    function redirectToDashboard() {
      window.location.href = "dashboard.html";
    }

    try {
      const session = JSON.parse(localStorage.getItem(ADMIN_SESSION_KEY) || "null");
      if (session && session.email === ADMIN_ACCOUNT.email) {
        redirectToDashboard();
      }
    } catch {
      localStorage.removeItem(ADMIN_SESSION_KEY);
    }

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const formData = new FormData(loginForm);
      const email = String(formData.get("email") || "").trim().toLowerCase();
      const password = String(formData.get("password") || "");
      const remember = Boolean(formData.get("remember"));

      if (email !== ADMIN_ACCOUNT.email || password !== ADMIN_ACCOUNT.password) {
        feedback.textContent = "Email hoặc mật khẩu admin không chính xác.";
        return;
      }

      const session = { name: ADMIN_ACCOUNT.name, email: ADMIN_ACCOUNT.email, remember };
      localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify(session));
      feedback.textContent = "";
      redirectToDashboard();
    });
  </script>
</body>
</html>

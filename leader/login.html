<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập trưởng nhóm - Jewels</title>
    <link rel="stylesheet" href="../shared/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preconnect"
      href="https://fpympioazglsrsshiqij.supabase.co"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&family=Sofia+Sans:ital,wght@0,1..1000;1,1..1000&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --admin-primary: #16766d;
        --admin-primary-soft: rgba(22, 118, 109, 0.12);
        --admin-bg: #f1f6f3;
        --admin-panel: #ffffff;
        --admin-line: #dce8e4;
        --admin-text: #193536;
        --admin-muted: #6b8180;
        --admin-error: #a74742;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(
          circle at top,
          #f7faf8 0%,
          var(--admin-bg) 45%,
          #e5eee9 100%
        );
        color: var(--admin-text);
        font-family: var(--body-font, "Sofia Sans", sans-serif);
      }

      .login-shell {
        width: min(940px, calc(100% - 32px));
        min-height: 640px;
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        border: 1px solid var(--admin-line);
        border-radius: 28px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(8px);
        box-shadow: 0 30px 70px rgba(20, 59, 60, 0.12);
      }

      .login-visual {
        position: relative;
        display: flex;
        align-items: end;
        padding: 42px;
        background:
          linear-gradient(
            135deg,
            rgba(20, 59, 60, 0.92),
            rgba(13, 40, 34, 0.88)
          ),
          url("../shared/images/banner-image2.jpg") center/cover no-repeat;
        color: #fff;
      }

      .login-visual::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(10, 28, 26, 0.25);
      }

      .login-visual-inner {
        position: relative;
        z-index: 1;
      }

      .brand-mark {
        display: inline-grid;
        place-items: center;
        width: 62px;
        height: 62px;
        margin-bottom: 24px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.18);
        font-family: "Cormorant Upright", Georgia, serif;
        font-size: 2.6rem;
        font-weight: 700;
      }

      .login-visual h1 {
        margin: 0 0 12px;
        font-family: "Cormorant Upright", Georgia, serif;
        font-size: clamp(2.7rem, 4vw, 4.3rem);
        line-height: 0.95;
        font-weight: 500;
      }

      .login-visual p {
        margin: 0;
        max-width: 360px;
        color: rgba(255, 255, 255, 0.88);
        font-size: 1rem;
      }

      .login-form-wrap {
        padding: 42px 38px;
        background: rgba(255, 255, 255, 0.92);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .eyebrow {
        margin: 0 0 8px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 0.78rem;
        color: var(--admin-primary);
        font-weight: 700;
      }

      .login-form-wrap h2 {
        margin: 0 0 8px;
        font-size: 2rem;
        font-family: "Cormorant Upright", Georgia, serif;
        font-weight: 600;
      }

      .login-form-wrap > p {
        margin: 0 0 32px;
        color: var(--admin-muted);
        font-size: 0.95rem;
      }

      .login-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--admin-text);
      }

      .field input {
        height: 50px;
        padding: 0 16px;
        border: 1px solid var(--admin-line);
        border-radius: 12px;
        background: #fff;
        font: inherit;
        color: inherit;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .field input:focus {
        border-color: var(--admin-primary);
        box-shadow: 0 0 0 3px var(--admin-primary-soft);
      }

      .password-wrap {
        position: relative;
        display: flex;
        align-items: center;
      }

      .password-wrap input {
        width: 100%;
        padding-right: 48px;
      }

      .toggle-password {
        position: absolute;
        right: 12px;
        background: none;
        border: 0;
        padding: 4px;
        color: var(--admin-muted);
        cursor: pointer;
        display: grid;
        place-items: center;
      }

      .toggle-password svg {
        width: 20px;
        height: 20px;
      }

      .login-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: -4px;
        font-size: 0.9rem;
      }

      .remember {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--admin-muted);
        cursor: pointer;
      }

      .remember input {
        accent-color: var(--admin-primary);
      }

      .helper-link {
        color: var(--admin-primary);
        text-decoration: none;
        transition: color 0.15s;
      }

      .helper-link:hover {
        text-decoration: underline;
      }

      .login-submit {
        height: 54px;
        border: 0;
        border-radius: 999px;
        background: var(--admin-primary);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s ease;
        margin-top: 6px;
      }

      .login-submit:hover {
        background: #10584f;
      }

      .admin-toast {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translate(-50%, -16px);
        width: min(420px, calc(100% - 32px));
        padding: 14px 18px;
        border: 1px solid var(--admin-error);
        border-radius: 14px;
        background: #fff;
        color: var(--admin-error);
        font-size: 0.95rem;
        font-weight: 600;
        text-align: center;
        box-shadow: 0 18px 40px rgba(20, 59, 60, 0.18);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease,
          visibility 0.25s;
        z-index: 10;
      }

      .admin-toast.show {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, 0);
      }

      @media (max-width: 720px) {
        .login-shell {
          grid-template-columns: 1fr;
        }

        .login-visual {
          min-height: 240px;
          padding: 30px;
        }

        .login-form-wrap {
          padding: 28px 22px 34px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <aside class="login-visual" aria-label="Banner trưởng nhóm">
        <div class="login-visual-inner">
          <div class="brand-mark">J</div>
          <p class="eyebrow" style="color: #fff; opacity: 0.85">
            Jewels team hub
          </p>
          <h1>Leader portal</h1>
          <p>
            Quản lý nhóm, theo dõi chấm công và duyệt đơn nghỉ phép của nhân sự
            trong nhóm.
          </p>
        </div>
      </aside>

      <section class="login-form-wrap">
        <p class="eyebrow">Cổng trưởng nhóm</p>
        <h2>Đăng nhập trưởng nhóm</h2>
        <p>Dành riêng cho Trưởng nhóm.</p>

        <form class="login-form" id="leaderLoginForm" novalidate>
          <label class="field">
            Email
            <input
              name="email"
              type="email"
              placeholder="Email"
              required
              autofocus
            />
          </label>

          <div class="field">
            <label for="leaderPassword">Mật khẩu</label>
            <div class="password-wrap">
              <input
                name="password"
                id="leaderPassword"
                type="password"
                placeholder="Mật khẩu"
                required
              />
              <button
                class="toggle-password"
                id="togglePassword"
                type="button"
                aria-label="Hiện mật khẩu"
                aria-pressed="false"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"
                  ></path>
                  <circle cx="12" cy="12" r="3"></circle>
                  <line
                    id="eyeSlash"
                    x1="4"
                    y1="4"
                    x2="20"
                    y2="20"
                    style="display: none"
                  ></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="login-meta">
            <label class="remember"
              ><input type="checkbox" name="remember" /> Ghi nhớ</label
            >
          </div>

          <button class="login-submit" type="submit">Đăng nhập</button>

          <div
            style="
              margin-top: 14px;
              text-align: center;
              font-size: 0.92rem;
              color: var(--admin-muted);
            "
          >
            Bạn là Quản lý?
            <a
              href="../manager/login.html"
              class="helper-link"
              style="font-weight: 600"
              >Đăng nhập Cổng Quản lý</a
            >
          </div>
        </form>
      </section>
    </div>

    <div
      class="admin-toast"
      id="leaderLoginToast"
      role="alert"
      aria-live="assertive"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="../shared/js/supabase-client.js"></script>
    <script src="../shared/js/portal-api.js?v=20261108-fix-v3"></script>
    <script>
      const loginForm = document.getElementById("leaderLoginForm");
      const portal = window.jewelsPortal;

      // Direct check: only redirect if leader session is active
      if (portal.validSession("leader")) {
        window.location.replace("leader-dashboard.html");
      }

      const toast = document.getElementById("leaderLoginToast");
      const passwordInput = document.getElementById("leaderPassword");
      const toggleButton = document.getElementById("togglePassword");
      const eyeSlash = document.getElementById("eyeSlash");

      const ERROR_MESSAGES = {
        invalid_credentials:
          "Email hoặc mật khẩu không chính xác. Vui lòng thử lại.",
        account_locked:
          "Tài khoản đang tạm khóa. Vui lòng thử lại sau 15 phút.",
        forbidden: "Tài khoản này không có quyền trưởng nhóm.",
      };

      let toastTimer;
      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 5000);
      }

      toggleButton.addEventListener("click", () => {
        const show = passwordInput.type === "password";
        passwordInput.type = show ? "text" : "password";
        toggleButton.setAttribute(
          "aria-label",
          show ? "Ẩn mật khẩu" : "Hiện mật khẩu",
        );
        toggleButton.setAttribute("aria-pressed", String(show));
        eyeSlash.style.display = show ? "" : "none";
        passwordInput.focus();
      });

      // Fire-and-forget: warm admin-login connection
      window
        .sbInvoke?.("admin-login", { body: { warm: true } })
        ?.catch(() => {});

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const formData = new FormData(loginForm);
        const username = String(formData.get("email") || "").trim();
        const password = String(formData.get("password") || "");

        if (!username || !password) {
          showToast("Vui lòng nhập đầy đủ email và mật khẩu.");
          return;
        }

        const submitButton = loginForm.querySelector(".login-submit");
        submitButton.disabled = true;

        try {
          const result = await portal.signIn("leader", { username, password });
          if (result.error) {
            if (result.error === "network_error") {
              showToast(
                "Không kết nối được máy chủ. Kiểm tra mạng (VPN/proxy) rồi thử lại.",
              );
            } else {
              showToast(
                ERROR_MESSAGES[result.error] ||
                  "Đăng nhập thất bại. Vui lòng thử lại.",
              );
            }
            passwordInput.value = "";
            passwordInput.focus();
            return;
          }

          submitButton.textContent = "Đang chuyển hướng...";
          const session = portal.getSession("leader");
          if (session?.token) {
            try {
              await window.sbInvoke("leader-portal", {
                headers: { "x-admin-token": session.token },
                body: { action: "ping" },
              });
            } catch (_) {}
          }

          window.location.href = "leader-dashboard.html";
        } catch (err) {
          console.error(err);
          showToast("Không thể kết nối máy chủ. Vui lòng thử lại sau.");
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>

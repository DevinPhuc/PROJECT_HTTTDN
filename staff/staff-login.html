<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập nhân viên - Jewels</title>
    <link rel="stylesheet" href="../shared/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&family=Sofia+Sans:ital,wght@0,1..1000;1,1..1000&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --admin-primary: #176b72;
        --admin-primary-soft: rgba(23, 107, 114, 0.12);
        --admin-bg: #eff5f4;
        --admin-panel: #ffffff;
        --admin-line: #d9e5e4;
        --admin-text: #1d3032;
        --admin-muted: #667a7c;
        --admin-error: #c15542;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(
          circle at top,
          #f8fbfa 0%,
          var(--admin-bg) 48%,
          #dcebea 100%
        );
        color: var(--admin-text);
        font-family: var(--body-font);
      }

      .login-shell {
        width: min(940px, calc(100% - 32px));
        min-height: 640px;
        height: 640px;
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        border: 1px solid var(--admin-line);
        border-radius: 28px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(8px);
        box-shadow: 0 30px 70px rgba(39, 27, 11, 0.12);
      }

      .login-visual {
        position: relative;
        display: flex;
        align-items: end;
        padding: 42px;
        background:
          linear-gradient(
            135deg,
            rgba(23, 107, 114, 0.9),
            rgba(16, 63, 73, 0.88)
          ),
          url("../shared/images/banner-image2.jpg") center/cover no-repeat;
        color: #fff;
      }

      .login-visual::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(12, 8, 5, 0.2);
      }

      .login-visual-inner {
        position: relative;
        z-index: 1;
      }

      .brand-mark {
        display: inline-grid;
        place-items: center;
        width: 62px;
        height: 62px;
        margin-bottom: 24px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.18);
        font-family: "Cormorant Upright", serif;
        font-size: 2.6rem;
        font-weight: 700;
      }

      .login-visual h1 {
        margin: 0 0 12px;
        font-size: clamp(2.7rem, 4vw, 4.3rem);
        line-height: 0.95;
        font-weight: 500;
      }

      .login-visual p {
        margin: 0;
        max-width: 360px;
        color: rgba(255, 255, 255, 0.86);
        font-size: 1rem;
      }

      .login-form-wrap {
        padding: 42px 38px;
        background: rgba(255, 255, 255, 0.9);
      }

      .login-form-wrap p {
        margin: 0;
        color: var(--admin-muted);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--admin-primary);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .login-form-wrap h2 {
        margin: 0 0 10px;
        font-size: clamp(2.2rem, 4vw, 3rem);
        line-height: 1;
        color: var(--admin-text);
      }

      .login-form {
        display: grid;
        gap: 18px;
        margin-top: 30px;
      }

      .field {
        display: grid;
        gap: 8px;
        color: var(--admin-text);
        font-weight: 600;
      }

      .field input {
        height: 52px;
        padding: 0 16px;
        border: 1px solid var(--admin-line);
        border-radius: 12px;
        background: #fff;
        font: inherit;
        color: var(--admin-text);
      }

      .field input:focus {
        outline: none;
        border-color: rgba(23, 107, 114, 0.5);
        box-shadow: 0 0 0 4px rgba(23, 107, 114, 0.08);
      }

      .password-wrap {
        position: relative;
        display: grid;
      }

      .password-wrap input {
        padding-right: 52px;
      }
      .password-wrap input::-ms-reveal {
        display: none;
      }

      .toggle-password {
        position: absolute;
        top: 50%;
        right: 8px;
        transform: translateY(-50%);
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        padding: 0;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--admin-muted);
        cursor: pointer;
      }

      .toggle-password:hover {
        color: var(--admin-primary);
        background: var(--admin-primary-soft);
      }

      .toggle-password svg {
        width: 20px;
        height: 20px;
      }

      .login-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: -4px;
        font-size: 0.9rem;
      }

      .remember {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--admin-muted);
      }

      .remember input {
        accent-color: var(--admin-primary);
      }

      .helper-link {
        color: var(--admin-primary);
        text-decoration: underline;
        transition: color 0.15s ease;
      }

      .helper-link:hover {
        color: #104f55;
      }

      .login-submit {
        height: 54px;
        border: 0;
        border-radius: 999px;
        background: var(--admin-primary);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .login-submit:hover {
        background: #104f55;
      }

      .login-feedback {
        display: none;
      }
      .admin-toast {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translate(-50%, -16px);
        width: min(420px, calc(100% - 32px));
        padding: 14px 18px;
        border: 1px solid var(--admin-error);
        border-radius: 14px;
        background: #fff;
        color: var(--admin-error);
        font-size: 0.95rem;
        font-weight: 600;
        text-align: center;
        box-shadow: 0 18px 40px rgba(39, 27, 11, 0.18);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease,
          visibility 0.25s;
        z-index: 10;
      }

      .admin-toast.show {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, 0);
      }

      .admin-note {
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px solid var(--admin-line);
        color: var(--admin-muted);
        font-size: 0.88rem;
      }

      @media (max-width: 720px) {
        .login-shell {
          grid-template-columns: 1fr;
          height: auto;
          min-height: auto;
        }

        .login-visual {
          min-height: 260px;
        }

        .login-form-wrap {
          padding: 28px 22px 34px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <aside class="login-visual" aria-label="Banner nhân viên">
        <div class="login-visual-inner">
          <div class="brand-mark">J</div>
          <p class="eyebrow" style="color: #fff; opacity: 0.8">
            Jewels management
          </p>
          <h1>Staff portal</h1>
          <p>Không gian làm việc dành cho đội ngũ nhân viên Jewels.</p>
        </div>
      </aside>

      <section class="login-form-wrap">
        <p class="eyebrow">Cổng nhân viên</p>
        <h2>Đăng nhập</h2>
        <p>Đăng nhập để truy cập bảng làm việc nội bộ.</p>

        <form class="login-form" id="staffLoginForm" novalidate>
          <label class="field">
            Email nhân viên
            <input name="email" type="email" placeholder="Email" required />
          </label>

          <div class="field">
            <label for="staffPassword">Mật khẩu</label>
            <div class="password-wrap">
              <input
                name="password"
                id="staffPassword"
                type="password"
                placeholder="Mật khẩu"
                required
              />
              <button
                class="toggle-password"
                id="togglePassword"
                type="button"
                aria-label="Hiện mật khẩu"
                aria-pressed="false"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"
                  ></path>
                  <circle cx="12" cy="12" r="3"></circle>
                  <line
                    id="eyeSlash"
                    x1="4"
                    y1="4"
                    x2="20"
                    y2="20"
                    style="display: none"
                  ></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="login-meta">
            <label class="remember"
              ><input type="checkbox" name="remember" /> Ghi nhớ</label
            >
          </div>

          <button class="login-submit" type="submit" disabled>Đăng nhập</button>

          <div
            style="
              margin-top: 16px;
              text-align: center;
              font-size: 0.92rem;
              color: var(--admin-muted);
              line-height: 1.6;
            "
          >
            <div>
              Bạn là Quản lý?
              <a
                href="../manager/login.html"
                class="helper-link"
                style="font-weight: 600"
                >Truy cập đường dẫn để vào trang đăng nhập của Quản lý</a
              >
            </div>
            <div style="margin-top: 6px">
              Bạn là Admin?
              <a
                href="../admin/login.html"
                class="helper-link"
                style="font-weight: 600"
                >Truy cập đường dẫn để vào trang đăng nhập của Admin</a
              >
            </div>
          </div>

          <p
            class="login-feedback"
            id="staffLoginFeedback"
            role="status"
            aria-live="polite"
          ></p>
        </form>
      </section>
    </div>

    <div
      class="admin-toast"
      id="adminLoginToast"
      role="alert"
      aria-live="assertive"
    ></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/js/supabase-client.js"></script>
    <script src="../shared/js/portal-api.js"></script>
    <script>
      const loginForm = document.getElementById("staffLoginForm");
      const feedback = document.getElementById("staffLoginFeedback");
      const portal = window.jewelsPortal;
      const passwordInput = document.getElementById("staffPassword");
      const togglePasswordBtn = document.getElementById("togglePassword");
      const eyeSlash = document.getElementById("eyeSlash");
      const toast = document.getElementById("adminLoginToast");

      let toastTimer;
      function showToast(message) {
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 5000);
      }

      togglePasswordBtn.addEventListener("click", () => {
        const show = passwordInput.type === "password";
        passwordInput.type = show ? "text" : "password";
        togglePasswordBtn.setAttribute(
          "aria-label",
          show ? "Ẩn mật khẩu" : "Hiện mật khẩu",
        );
        togglePasswordBtn.setAttribute("aria-pressed", String(show));
        eyeSlash.style.display = show ? "" : "none";
        passwordInput.focus();
      });

      // A valid session goes straight in; the dashboard re-checks access on boot.
      if (portal.validSession("staff"))
        window.location.replace("staff-dashboard.html");

      // Fire-and-forget warm-up, same trick the admin login page uses.
      window
        .sbInvoke?.("admin-login", { body: { warm: true } })
        ?.catch(() => {});

      const MESSAGES = {
        invalid_credentials:
          "Email hoặc mật khẩu không chính xác. Vui lòng thử lại.",
        account_locked:
          "Bạn đã bị khóa tài khoản, vui lòng liên hệ với Trưởng nhóm hoặc Quản lý để giải quyết nếu như có sự nhầm lẫn",
        forbidden: "Tài khoản không được phép truy cập cổng nhân viên.",
        network_error: "Không thể kết nối máy chủ. Vui lòng thử lại sau.",
        server_error: "Máy chủ gặp lỗi. Vui lòng thử lại sau.",
      };

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const formData = new FormData(loginForm);
        const email = String(formData.get("email") || "").trim();
        const password = String(formData.get("password") || "");
        if (!email || !password) {
          showToast("Vui lòng nhập đầy đủ email và mật khẩu.");
          if (feedback) feedback.textContent = "Vui lòng nhập đầy đủ email và mật khẩu.";
          return;
        }

        const submitButton = loginForm.querySelector(".login-submit");
        if (submitButton) submitButton.disabled = true;
        showToast("Đang xác thực...");

        try {
          const result = await portal.signIn("staff", {
            username: email,
            password,
          });
          if (result.error) {
            if (result.error === "account_locked") {
              portal.showNoticeModal({ type: "account_locked" }, "staff");
            }
            const errMsg =
              MESSAGES[result.error] || "Đã xảy ra lỗi. Vui lòng thử lại.";
            if (feedback) feedback.textContent = errMsg;
            showToast(errMsg);
            passwordInput.value = "";
            passwordInput.focus();
            return;
          }
          if (toast) toast.classList.remove("show");
          if (submitButton) submitButton.textContent = "Đang chuyển hướng...";

          const session = portal.getSession("staff");
          if (session?.token) {
            try {
              await window.sbInvoke("staff-portal", {
                headers: { "x-admin-token": session.token },
                body: { action: "ping" },
              });
            } catch (_) {}
          }

          window.location.replace("staff-dashboard.html");
        } catch (err) {
          console.error(err);
          showToast("Không thể kết nối máy chủ. Vui lòng thử lại sau.");
          if (feedback) feedback.textContent = "Không thể kết nối máy chủ. Vui lòng thử lại sau.";
        } finally {
          if (submitButton) {
            submitButton.disabled = false;
            submitButton.textContent = "Đăng nhập";
          }
        }
      });

      // JS is alive and the handler is attached; only now is submitting safe.
      loginForm.querySelector(".login-submit").disabled = false;
    </script>
  </body>
</html>
